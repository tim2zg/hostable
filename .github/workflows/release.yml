name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: hostable-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select immutable release version
        id: version
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_RUN: ${{ github.run_number }}
        run: |
          if [[ $RELEASE_REF == refs/tags/* ]]; then
            tag=${RELEASE_REF#refs/tags/}
          else
            tag=$(python3 -c 'import os,tomllib; v=tomllib.load(open("backend/Cargo.toml","rb"))["package"]["version"].split("."); print("v"+v[0]+"."+v[1]+"."+os.environ["RELEASE_RUN"])')
          fi
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Only stable version tags are released"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build Binary via Docker
        env:
          BUILD_VERSION: ${{ steps.version.outputs.tag }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile --build-arg HOSTABLE_BUILD_VERSION="$BUILD_VERSION" --build-arg HOSTABLE_BUILD_COMMIT="$BUILD_COMMIT" -t hostable-builder .
          docker run --rm hostable-builder --version
          docker create --name hostable-extract hostable-builder
          docker cp hostable-extract:/usr/local/bin/hostable hostable-linux-amd64
          docker rm hostable-extract
          sha256sum hostable-linux-amd64 > hostable-linux-amd64.sha256

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hostable-linux-amd64
            hostable-linux-amd64.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: legacy
