---
- name: Select the database guest
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add managed database
      ansible.builtin.add_host:
        name: managed_database
        ansible_host: '{{ guest_ip }}'
        ansible_user: root
        ansible_ssh_private_key_file: '{{ ssh_key }}'
        ansible_ssh_common_args: '-o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ known_hosts }} -o IdentitiesOnly=yes'
      no_log: true

- name: Renew without restarting PostgreSQL
  hosts: managed_database
  gather_facts: false
  tasks:
    - name: Renew signed identity
      ansible.builtin.import_tasks: ../tasks/database_tls.yml
    - name: Reload PostgreSQL TLS configuration
      ansible.builtin.service:
        name: postgresql
        state: reloaded
